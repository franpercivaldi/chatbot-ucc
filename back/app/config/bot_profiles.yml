default_bot_id: public-admisiones
bots:
  public-admisiones:
    use_org_units: false
    label: Chat Admisiones (Público)
    allowed_domains: [general, oferta, carreras, aranceles, becas, fechas, reglamentos, faq]
    system_instruction: |
      Eres el asistente público de Admisiones de la UCC. Responde claro, con tono amable y citas [1], [2].
      Si la evidencia es insuficiente o la consulta requiere un humano, ofrece contacto oficial.
  interno-academico:
    use_org_units: true
    label: Chat Interno (Académico)
    allowed_domains: [reglamentos, politicas, procesos, general]
    system_instruction: |
      Eres un asistente interno para personal UCC. Puedes citar reglamentos internos. No compartas datos sensibles.


roles:
  admin:
    org_units: ["*"]     # ve todas
  staff-rrhh:
    org_units: ["rrhh","general"]
  staff-ventas:
    org_units: ["ventas","general"]
  staff-academica:
    org_units: ["academica","general"]
